<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <style>
    * {
      box-sizing: border-box;  
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      background: #f4f6f9;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #2c3e50;
    }

    .container {
      background-color: #ffffff;
      padding: 2.5rem 3rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
    }

    .container h2 {
      margin-bottom: 1rem;
      font-size: 1.8rem;
      font-weight: 600;
      text-align: center;
      color: #34495e;
    }

    .container p {
      font-size: 0.95rem;
      margin-bottom: 2rem;
      text-align: center;
      color: #7f8c8d;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .input-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #dcdde1;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #2980b9;
    }

    button {
      width: 100%;
      background-color: #2980b9;
      color: white;
      padding: 0.9rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #2471a3;
    }

    .back-link {
      display: block;
      margin-top: 1.5rem;
      text-align: center;
      color: #2980b9;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Reset Your Password</h2>
    <p>Please enter the email address associated with your account. We will send you a link to reset your password.</p>
    <form id="reset-password-form">
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <button type="submit">Send Reset Link</button>
    </form>
    <a href="/login" class="back-link">Return to Login</a>
  </div>
  
  <!-- Firebase SDK (modular version) -->
  <script type="module">
    // Import Firebase functions needed for initialization and auth
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js';
    import { getAuth, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/9.1.3/firebase-auth.js';

    // Your Firebase project configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAOk65Mg_P1ISLbGRB6I-3HDL-U-hCFO-c",
      authDomain: "rotbot-b300b.firebaseapp.com",
      databaseURL: "https://rotbot-b300b-default-rtdb.firebaseio.com",
      projectId: "rotbot-b300b",
      storageBucket: "rotbot-b300b.firebasestorage.app",
      messagingSenderId: "1022382810982",
      appId: "1:1022382810982:web:cb0f1a631f857de4a18aa7",
      measurementId: "G-B6S4DC2L03"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Handle password reset form submission
    document.getElementById('reset-password-form').addEventListener('submit', function(e) {
      e.preventDefault();  // Prevent the form from reloading the page

      const email = document.getElementById('email').value;

      // Send the password reset email
      sendPasswordResetEmail(auth, email)
        .then(() => {
          alert('Password reset email sent!');
        })
        .catch((error) => {
          alert('Error: ' + error.message);
        });
    });
  </script>
</body>
</html>
