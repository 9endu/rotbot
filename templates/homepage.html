<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome to RotBot</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    body {
      font-family: 'Orbitron', sans-serif;
      color: #222;
      text-align: center;
      height: 100vh;
      background-color: #ffffff;
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      z-index: -1;
    }

    .container {
      max-width: 800px;
      padding: 20px;
      width: 100%;
      color: white;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5em;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      border-right: 4px solid #0a4e30;
      width: fit-content;
      margin: auto;
      animation: typing 3s steps(20, end) forwards, blink 0.7s infinite;
      color: white;
      text-shadow:
        1px 1px 0 #0a4e30,
        2px 2px 0 #0a4e30,
        3px 3px 0 #0a4e30,
        4px 4px 10px rgba(0, 0, 0, 0.3);
    }

    p {
      font-size: 1.2em;
      margin-top: 10px;
      color: white;
    }

    .predict-section {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .predict-btn {
      padding: 12px 24px;
      font-size: 1.2em;
      background-color: #0e743c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 250px;
      margin: 10px auto;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }

    .predict-btn:hover {
      background-color: #09592f;
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(0, 255, 170, 0.3);
    }

    .predict-options {
      margin-top: 15px;
      display: none;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 15px 35px;
      border-radius: 12px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 255, 170, 0.3);
      width: 250px;
    }

    .option-btn:hover {
      background: rgba(0, 255, 170, 0.2);
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 170, 0.6);
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .logout-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background-color: #d9534f;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      cursor: pointer;
      z-index: 1000;
    }

    .logout-btn:hover {
      background-color: #c9302c;
    }

    .track-history-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 12px 24px;
      font-size: 1em;
      background-color: #082c18;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }

    .track-history-btn:hover {
      background-color: #35825a;
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(6, 142, 96, 0.3);
    }

    /* New About Us Button */
    .about-us-btn {
      position: fixed;
      top: 20px;
      left: 220px; /* Positioned next to Track Your History */
      padding: 12px 24px;
      font-size: 1em;
      background-color: #082c18;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }

    .about-us-btn:hover {
      background-color: #35825a;
      transform: translateY(-3px);
      box-shadow:  0 0 15px rgba(6, 142, 96, 0.3);
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video autoplay muted loop class="video-bg">
    <source src="{{ url_for('uploads', filename='professionalbackground.mp4') }}" type="video/mp4" />
    Your browser does not support HTML5 video.
  </video>
  <div class="overlay"></div>

  {% if user %}
    <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
  {% endif %}

  <div class="container">
    {% if user %}
      <h1>Welcome to RotBot !</h1>
    {% else %}
      <h1>Welcome to RotBot!</h1>
    {% endif %}
    <p>See details if your fruit is rotten or not!</p>
    <p>Get tips on storage, ripeness, and preservation.</p>

    <div class="predict-section">
      <button class="predict-btn" onclick="toggleOptions('predictOptions')">Predict</button>
      <div class="predict-options" id="predictOptions">
        <button class="option-btn" onclick="location.href='/custom'">Predict from Custom Sensor Data</button>
        <button class="option-btn" onclick="location.href='/firebase'">Predict Live from Database</button>
      </div>

      <button class="predict-btn" onclick="toggleOptions('shelfLifeOptions')">Shelf Life Prediction</button>
      <div class="predict-options" id="shelfLifeOptions">
        <button class="option-btn" onclick="location.href='/upload_image'">From Image</button>
        <button class="option-btn" onclick="location.href='/shelf-life-data'">From Live Sensor Data</button>
      </div>

      <!-- Track History Button -->
      <button class="track-history-btn" onclick="location.href='/track_history'">Track Your History</button>

      <!-- About Us Button -->
      <button class="about-us-btn" onclick="location.href='/about_us'">About Us</button>
    </div>
  </div>

  <!-- Botpress Webchat Scripts -->
  <script src="https://cdn.botpress.cloud/webchat/v2.2/inject.js"></script>
  <script src="https://files.bpcontent.cloud/2025/02/07/12/20250207124757-UGW9GJD7.js"></script>

  <script>
    window.botpressWebChat.init({
      composerPlaceholder: "Ask me anything about fruit freshness!",
      botId: "YOUR_BOT_ID",
      host: "https://cdn.botpress.cloud/webchat/v2",
      showPoweredBy: false,
      enableConversationDeletion: true
    });

    function toggleOptions(optionId) {
      const currentOption = document.getElementById(optionId);
      const allOptions = document.querySelectorAll('.predict-options');
      
      // Hide all other options
      allOptions.forEach(option => {
        if (option !== currentOption) {
          option.style.display = 'none';
        }
      });

      // Toggle the visibility of the clicked option
      currentOption.style.display = currentOption.style.display === "flex" ? "none" : "flex";
    }

    window.onload = () => {
      const video = document.querySelector('.video-bg');
      video.playbackRate = 0.5;
    }
  </script>

</body>
</html>
