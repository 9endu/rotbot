<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      width: 350px;
      position: relative;
      border: 1px solid #555; /* Added a base border for contrast */
      transition: all 0.3s ease-in-out;
    }

    /* Subtle Neon glow effect around the card */
    .container:hover {
      box-shadow: 0 0 5px 1px #4ef1c1, 0 0 10px 2px #4ef1c1;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #ffffff;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    input {
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
      border: 1px solid #555;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #2c2c2c;
      color: #f0f0f0;
      transition: 0.3s;
    }

    input:focus {
      border-color: #4ef1c1; /* Changed to #4ef1c1 */
      outline: none;
      background-color: #333;
    }

    button {
      background: #4ef1c1; /* Changed to #4ef1c1 */
      color: white;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s, transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      background: #3be6ad; /* Darker shade of #4ef1c1 */
      transform: scale(1.02);
      box-shadow: 0 4px 10px rgba(78, 241, 193, 0.3);
    }

    .link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #aaa;
    }

    .link a {
      color: #4ef1c1; /* Changed to #4ef1c1 */
      text-decoration: none;
    }

    .link a:hover {
      text-decoration: underline;
    }

    /* Loader */
    .loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(18, 18, 18, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      display: none;
    }

    .loader-text {
      font-size: 2rem;
      color: #4ef1c1; /* Changed to #4ef1c1 */
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Error message styling */
    .error-message {
      color: #ff6b6b;
      background: #3a1c1c;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Loader -->
  <div class="loader">
    <span class="loader-text">Loading...</span>
  </div>

  <div class="container">
    <h2>Login</h2>
  
    {% if error %}
      <div class="error-message">
        {{ error }}
      </div>
    {% endif %}
  
    <form method="POST" action="/login">
      <input type="email" name="email" placeholder="Email" required autofocus>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  
    <div class="link">
      Don't have an account? <a href="/signup">Sign up</a>
    </div>

    <div class="link">
      <a href="/forgot-password">Forgot password?</a>
    </div>
  </div>
  

  <script>
    // Show loader on page navigation
    window.addEventListener('beforeunload', () => {
      document.querySelector('.loader').style.display = 'flex';
    });

    // Hide loader after page load
    window.addEventListener('load', () => {
      document.querySelector('.loader').style.display = 'none';
    });

    
    
  </script>
</body>  
</html>
