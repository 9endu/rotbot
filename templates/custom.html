<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Custom Sensor Prediction - RotBot</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f7f7f7;
      padding: 40px;
      text-align: center;
    }

    h1 {
      color: #0e743c;
      font-family: 'Orbitron', sans-serif;
    }

    form {
      margin-top: 30px;
      display: inline-block;
      background-color: #ffffff;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    input {
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #0e743c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
    }

    .home-btn {
  position: absolute;
  top: 40px;
  left: 40px;
  background-color: #0e743c;
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 500;
  transition: all 0.3s ease;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

.home-btn:hover {
  background-color: #09592f;
  transform: translateX(-3px);
}


    .result {
      margin-top: 25px;
      font-size: 1.2em;
      color: #222;
    }
  </style>
</head>
<body>
<!-- Add this in <head> if not already included -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <a href="/" class="home-btn"><i class="fas fa-home"></i> Homepage</a>
  
  <h1>Custom Sensor Data Prediction</h1>
  <form id="customForm">
    <input type="number" step="any" id="methane" placeholder="Methane level (ppm)" required />
    <input type="number" step="any" id="temperature" placeholder="Temperature (°C)" required />
    <input type="number" step="any" id="humidity" placeholder="Humidity (%)" required />
    <button type="submit">Predict</button>
  </form>

  <div class="result" id="result"></div>

  <script>
    document.getElementById("customForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const methane = parseFloat(document.getElementById("methane").value);
      const temperature = parseFloat(document.getElementById("temperature").value);
      const humidity = parseFloat(document.getElementById("humidity").value);

      const response = await fetch("/custom", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ methane, temperature, humidity })
      });

      const data = await response.json();
      document.getElementById("result").innerText = "Predicted Freshness Status: " + data.prediction;
    });
  </script>

</body>
</html>
