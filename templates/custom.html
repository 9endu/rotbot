<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Custom Sensor Prediction</title>
  <!-- Font and Icon Links -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #040d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      color: white;
      overflow: hidden;
    }
    .container {
      background: rgba(22, 22, 22, 0.7);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 25px #00ffcc;
      text-align: center;
      width: 350px;
    }
    .container h2 {
      color: #00ffcc;
      font-size: 1.8em;
      margin-bottom: 30px;
      text-shadow: 0 0 10px #00ffcc;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #f1f1f1;
      color: #000;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
      transition: 0.3s ease;
    }
    input:focus {
      outline: none;
      background: #fff;
      box-shadow: 0 0 10px #00ffaa, 0 0 20px #00ffaa;
    }
    .error {
      color: red;
      font-size: 14px;
      margin-top: -8px;
      margin-bottom: 8px;
      text-align: left;
    }
    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #00ffaa, #00cc88);
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 12px #00ffaa;
      transition: all 0.3s ease;
      position: relative;
    }
    .btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 8px #00ffaa, 0 0 12px #00ffaa;
    }
    .btn.loading::after {
      content: "";
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      border: 3px solid #fff;
      border-top: 3px solid #000;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      0% { transform: translateY(-50%) rotate(0deg); }
      100% { transform: translateY(-50%) rotate(360deg); }
    }
    #result {
      margin-top: 20px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      font-size: 1.1em;
      color: #00ffaa;
      text-shadow: 0 0 5px #00ffaa;
      display: none;
    }
    .custom-wrapper .home-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: #0e743c;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }

    .custom-wrapper .home-btn:hover {
      background-color: #09592f;
      transform: translateX(-3px);
    }
  </style>
</head>
<body>
  <div class="custom-wrapper">
    <div class="container">
      <a href="/" class="home-btn"><i class="fas fa-home"></i> Homepage</a>
      <h2>Custom Sensor Prediction</h2>
      <form id="sensorForm">
        <input type="number" id="methane" placeholder="Methane Value (ppm)" step="any" />
        <div id="methaneError" class="error"></div>

        <input type="number" id="temperature" placeholder="Temperature (°C)" step="any" />
        <div id="temperatureError" class="error"></div>

        <input type="number" id="humidity" placeholder="Humidity (%)" step="any" />
        <div id="humidityError" class="error"></div>

        <button type="submit" class="btn" id="predictBtn">Predict</button>
      </form>

      <div id="result"></div>
    </div>
  </div>

  <script>
    const gas = document.getElementById("methane");
    const temperature = document.getElementById("temperature");
    const humidity = document.getElementById("humidity");

    const gasError = document.getElementById("methaneError");
    const temperatureError = document.getElementById("temperatureError");
    const humidityError = document.getElementById("humidityError");

    const predictBtn = document.getElementById("predictBtn");
    const resultDiv = document.getElementById("result");

    let touched = {
      gas: false,
      temperature: false,
      humidity: false,
    };

    // Define the temperature-humidity relationship rules
    const getMinHumidityForTemperature = (temp) => {
      // Get the floor value for temperature ranges
      const floorTemp = Math.floor(temp);
      
      // Handle decimal values by using the floor temperature
      if (floorTemp >= 27 && floorTemp <= 33) return 61; // 27-33.999...°C → 61%
      if (floorTemp === 34) return 62;                   // 34-34.999...°C → 62%
      if (floorTemp >= 35 && floorTemp <= 37) return 63; // 35-37.999...°C → 63%
      
      return null; // Outside valid range
    };

    gas.addEventListener("input", () => {
      touched.gas = true;
      validateGas();
    });

    temperature.addEventListener("input", () => {
      touched.temperature = true;
      validateTemperature();
      // When temperature changes, validate humidity too
      if (touched.humidity) validateHumidity();
    });

    humidity.addEventListener("input", () => {
      touched.humidity = true;
      validateHumidity();
    });

    function validateGas() {
      if (!touched.gas) return;
      const value = parseFloat(gas.value);
      gasError.textContent = (isNaN(value) || value < 0 || value > 500)
        ? "Gas value must be between 0–500 ppm."
        : "";
    }

    function validateTemperature() {
      if (!touched.temperature) return;
      const value = parseFloat(temperature.value);
      
      if (isNaN(value)) {
        temperatureError.textContent = "Please enter a valid temperature.";
        return;
      }
      
      const minTemp = 27;
      const maxTemp = 37;
      
      if (value < minTemp || value > maxTemp) {
        temperatureError.textContent = `Temperature must be between ${minTemp}–${maxTemp}°C.`;
      } else {
        temperatureError.textContent = "";
      }
    }

    function validateHumidity() {
      if (!touched.humidity) return;
      const tempValue = parseFloat(temperature.value);
      const humValue = parseFloat(humidity.value);
      
      if (isNaN(humValue)) {
        humidityError.textContent = "Please enter a valid humidity value.";
        return;
      }
      
      // First check basic range
      if (humValue < 0 || humValue > 100) {
        humidityError.textContent = "Humidity must be between 0–100%.";
        return;
      }
      
      // Then check the temperature-humidity relationship if temperature is valid
      if (!isNaN(tempValue)) {
        const requiredMinHumidity = getMinHumidityForTemperature(tempValue);
        if (requiredMinHumidity !== null && humValue < requiredMinHumidity) {
          const floorTemp = Math.floor(tempValue);
          humidityError.textContent = `For temperatures ${floorTemp}–${floorTemp+1}°C, humidity must be at least ${requiredMinHumidity}%.`;
          return;
        }
      }
      
      humidityError.textContent = "";
    }

    document.getElementById("sensorForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      touched.gas = touched.temperature = touched.humidity = true;
      validateGas();
      validateTemperature();
      validateHumidity();

      if (
        !gasError.textContent &&
        !temperatureError.textContent &&
        !humidityError.textContent
      ) {
        // Clear previous result before sending request
        resultDiv.style.display = 'none';
        resultDiv.innerText = "";

        predictBtn.classList.add("loading");
        predictBtn.disabled = true;

        const methane = parseFloat(gas.value);
        const temp = parseFloat(temperature.value);
        const hum = parseFloat(humidity.value);

        try {
          const response = await fetch("/custom", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              methane,
              temperature: temp,
              humidity: hum,
            }),
          });

          const data = await response.json();

          resultDiv.innerText = "Predicted Freshness Status: " + data.prediction;
          resultDiv.style.display = 'block';
        } catch (error) {
          console.error("Error:", error);
          resultDiv.innerText = "Error fetching prediction.";
          resultDiv.style.display = 'block';
        } finally {
          predictBtn.classList.remove("loading");
          predictBtn.disabled = false;
        }
      }
    });
  </script>
</body>
</html>
