<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 400px;
      position: relative;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    input {
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: 0.3s;
    }

    input:focus {
      border-color: #007bff;
      outline: none;
    }

    button {
      background: #007bff;
      color: white;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    .link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
    }

    .link a {
      color: #007bff;
      text-decoration: none;
    }

    .link a:hover {
      text-decoration: underline;
    }

    /* Loader */
    .loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      display: none;
    }

    .loader-text {
      font-size: 2rem;
      color: #007bff;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <!-- Loader -->
  <div class="loader">
    <span class="loader-text">Loading...</span>
  </div>

  <div class="container">
    <h2>Create Account</h2>
    <form method="POST" action="/signup">
        <input type="text" name="company_name" placeholder="Company Name" required minlength="2">
        <input type="text" name="industry" placeholder="Industry Type" required>
        <input type="text" name="location" placeholder="Location / Region" required>
        <input type="text" name="name" placeholder="Your Name" required pattern="[A-Za-z\s]{2,}">
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="tel" name="phone" placeholder="Phone Number" required pattern="\d{10}">
        <input type="password" name="password" placeholder="Password" required minlength="6">
        
      <button type="submit">Sign Up</button>
    </form>
    <div class="link">
      Already have an account? <a href="/login">Login</a>
    </div>
  </div>

  <script>
    window.addEventListener('beforeunload', () => {
      document.querySelector('.loader').style.display = 'flex';
    });

    window.addEventListener('load', () => {
      document.querySelector('.loader').style.display = 'none';
    });

    const form = document.querySelector("form");

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    const companyName = form.company_name.value.trim();
    const industry = form.industry.value.trim();
    const location = form.location.value.trim();
    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const phone = form.phone.value.trim();
    const password = form.password.value;

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const phoneRegex = /^\d{10}$/;
    const nameRegex = /^[A-Za-z\s]{2,}$/;
    const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$/;

    if (companyName.length < 2) {
      alert("Company name must be at least 2 characters.");
      return;
    }

    if (industry === "") {
      alert("Industry type cannot be empty.");
      return;
    }

    if (location === "") {
      alert("Location/Region cannot be empty.");
      return;
    }

    if (!nameRegex.test(name)) {
      alert("Name must be at least 2 characters and contain only letters and spaces.");
      return;
    }

    if (!emailRegex.test(email)) {
      alert("Please enter a valid email address.");
      return;
    }

    if (!phoneRegex.test(phone)) {
      alert("Phone number must be 10 digits.");
      return;
    }

    if (!passwordRegex.test(password)) {
      alert("Password must be at least 6 characters and contain at least one letter and one number.");
      return;
    }

    // If all validations pass
    document.querySelector('.loader').style.display = 'flex';
    form.submit();
  });
  </script>
</body>
</html>
