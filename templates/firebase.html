<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prediction from Firebase</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(to right, #020c1b, #001f1f);
      color: #00ffaa;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      background: rgba(0, 20, 30, 0.85);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 0 25px rgba(0, 255, 170, 0.15), 0 0 45px rgba(0, 255, 170, 0.1);
      margin-bottom: 30px;
      border: 1px solid #00ffaa33;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      color: #00ffaa;
      text-align: center;
      margin-bottom: 30px;
      text-shadow: 0 0 12px #00ffaa;
      position: relative;
    }

    h1::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 2px;
      background: #00ffaa;
      box-shadow: 0 0 10px #00ffaa;
    }

    .result, .error {
      font-size: 1.1em;
      color: #aaffff;
      margin-top: 20px;
    }

    .error {
      color: #ff6b6b;
    }

    .custom-wrapper .home-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: #0e743c;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }
    .custom-wrapper .home-btn:hover {
      background-color: #09592f;
      transform: translateX(-3px);
    }

    #prediction-result p,
    #sensor-data p {
      margin: 10px 0;
      font-size: 1rem;
      color: #aaffff;
    }

    strong {
      color: #00ffff;
    }
  </style>
</head>
<body>

  <div class="custom-wrapper">
    <a href="/" class="home-btn"><i class="fas fa-home"></i> Homepage</a>
  </div>
  <div class="container">
    <h1>Prediction from Firebase</h1>

    <div id="prediction-result">
      <!-- The result will be dynamically updated here -->
    </div>

    <div id="sensor-data">
      <!-- The sensor data will be dynamically updated here -->
    </div>

      </div>

  <script>
    function fetchLatestData() {
      fetch('/firebase_data')
        .then(response => response.json())
        .then(data => {
          if (data.error) {
            document.getElementById('prediction-result').innerHTML = `<p class="error"><strong>Error:</strong> ${data.error}</p>`;
            return;
          }

          // Update the prediction
          document.getElementById('prediction-result').innerHTML = `<p><strong>Prediction:</strong> ${data.prediction}</p>`;

          // Update the sensor data
          document.getElementById('sensor-data').innerHTML = `
            <p><strong>Methane Level:</strong> ${data.methane} ppm</p>
            <p><strong>Temperature:</strong> ${data.temperature} °C</p>
            <p><strong>Humidity:</strong> ${data.humidity} %</p>
          `;
        })
        .catch(error => {
          console.error('Error fetching data:', error);
        });
    }

    // Fetch data every 5 seconds
    setInterval(fetchLatestData, 5000);

    // Fetch the latest data immediately when the page loads
    fetchLatestData();
  </script>

</body>
</html>
